<div id="view-chat" class="app-view">
    <div class="app-header">
        <h1 class="app-title"><i class="fa-solid fa-comments"></i> Chat</h1>
        <div style="display:flex; align-items:center; gap:10px;">
            <button class="btn-tool" onclick="showQrCode()" title="手機連線">
                <i class="fa-solid fa-qrcode"></i>
            </button>

            <button class="btn-tool danger" onclick="clearAllChat()" title="清空紀錄">
                <i class="fa-solid fa-trash-can"></i>
            </button>

            <div class="user-placeholder"></div>
        </div>
    </div>

    <div class="chat-container">

        <div id="chat-messages" class="chat-messages"></div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="輸入訊息或貼上網址..."
                onkeyup="if(event.key==='Enter') sendChat()">
            <button class="btn-send" onclick="sendChat()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <div id="edit-chat-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="width:400px; text-align:left;">
            <h3 style="margin-top:0; color:var(--text-main);">編輯訊息</h3>
            <input type="hidden" id="edit-msg-id">
            <textarea id="edit-msg-content"
                style="width:100%; height:120px; background:var(--bg-input); border:1px solid var(--border); padding:12px; border-radius:8px; color:var(--text-main); resize:none; box-sizing:border-box; outline:none; font-family:'Segoe UI'; font-size:1rem;"></textarea>
            <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
                <button class="btn-modal btn-cancel" onclick="closeEditChatModal()">取消</button>
                <button class="btn-modal btn-confirm" onclick="submitEditChat()">更新</button>
            </div>
        </div>
    </div>

    <div id="qr-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="width:300px; text-align:center;">
            <h3 style="margin-top:0; color:var(--text-main);">手機掃描連線</h3>
            <div id="qrcode-container"
                style="background:white; padding:15px; border-radius:10px; margin:20px auto; width:200px; height:200px; display:flex; justify-content:center; align-items:center;">
            </div>
            <p id="qr-ip-text"
                style="color:var(--accent); font-weight:bold; font-family:monospace; background:var(--bg-input); padding:5px; border-radius:4px; margin-bottom:10px; word-break:break-all;">
            </p>
            <p style="color:var(--text-sub); font-size:0.9rem;">請確保手機與電腦在同一 Wi-Fi</p>
            <button class="btn-modal btn-cancel" onclick="closeQrModal()"
                style="width:100%; margin-top:10px;">關閉</button>
        </div>
    </div>
</div>
