<div id="view-quiz" class="app-view">
    <div class="app-header">
        <h1 class="app-title"><i class="fa-solid fa-graduation-cap"></i> Quiz</h1>
        <div class="user-placeholder"></div>
    </div>

    <div class="quiz-layout">
        <!-- 左欄：題庫 -->
        <div class="quiz-sidebar">
            <div style="display:flex;gap:8px;">
                <button class="btn-tool" style="flex:1;background:var(--accent);color:white;border-radius:12px;height:40px;white-space:nowrap;" onclick="openBankModal()">
                    <i class="fa-solid fa-plus"></i> 新增題庫
                </button>
                <button id="btn-history" class="btn-tool" style="flex:1;border-radius:12px;height:40px;background:var(--input-bg);color:var(--text-sub);white-space:nowrap;" onclick="toggleHistoryPanel()">
                    <i class="fa-solid fa-clock-rotate-left"></i> 歷史
                </button>
            </div>
            <div id="quiz-bank-list"></div>
        </div>

        <!-- 右欄：題目 -->
        <div class="quiz-main">
            <div class="quiz-toolbar">
                <span class="quiz-toolbar-title" id="quiz-current-bank-name">請選擇題庫</span>
                <div class="quiz-toolbar-btns">
                    <button class="btn-tool" id="btn-quiz-assess" onclick="openAssessModal()" style="display:none;background:var(--accent);color:white;" title="評測">
                        <i class="fa-solid fa-play"></i> 評測
                    </button>
                </div>
            </div>
            <!-- 題目列表 -->
            <div id="quiz-questions-container" class="quiz-questions-list">
                <div class="quiz-empty"><i class="fa-solid fa-graduation-cap"></i><span>先從左側選擇或建立一個題庫</span></div>
            </div>
            <!-- 歷史紀錄面板（內嵌） -->
            <div id="quiz-history-panel" style="display:none;flex:1;overflow:hidden;display:none;flex-direction:column;gap:12px;">
                <div style="display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;align-items:center;">
                    <select id="history-bank-filter" class="custom-select" style="font-size:0.82rem;height:34px;" onchange="loadQuizHistory()">
                        <option value="">全部題庫</option>
                    </select>
                    <div class="history-filter-tabs" id="history-filter-tabs" style="display:none;">
                        <button class="history-tab-btn active" onclick="filterHistoryDetail('all',this,_historyDetailData)">全部</button>
                        <button class="history-tab-btn" id="hft-wrong" onclick="filterHistoryDetail('wrong',this,_historyDetailData)">答錯</button>
                        <button class="history-tab-btn" id="hft-correct" onclick="filterHistoryDetail('correct',this,_historyDetailData)">答對</button>
                    </div>
                </div>
                <!-- 選中後的摘要列 -->
                <div id="history-inline-summary" style="display:none;"></div>
                <!-- 紀錄列表 or 答題詳情 -->
                <div id="history-inline-content" class="quiz-questions-list" style="flex:1;overflow-y:auto;"></div>
            </div>
        </div>
    </div>
</div>

<!-- 評測選擇 Modal -->
<div id="quiz-assess-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="width:420px;text-align:left;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <h3 class="modal-title" style="margin:0;"><i class="fa-solid fa-play"></i> 評測</h3>
            <button class="btn-tool" onclick="closeAssessModal()" style="width:30px;height:30px;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;">
            <!-- 練習模式 -->
            <button onclick="closeAssessModal();openPracticeSettings();"
                style="background:var(--input-bg);border:1.5px solid var(--border-color);border-radius:14px;padding:18px 20px;text-align:left;cursor:pointer;transition:0.2s;color:var(--text-main);"
                onmouseover="this.style.borderColor='var(--accent)';this.style.background='var(--accent-dim)'"
                onmouseout="this.style.borderColor='var(--border-color)';this.style.background='var(--input-bg)'">
                <div style="display:flex;align-items:center;gap:12px;">
                    <div style="width:40px;height:40px;border-radius:10px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:1.1rem;flex-shrink:0;">
                        <i class="fa-solid fa-dumbbell"></i>
                    </div>
                    <div>
                        <div style="font-weight:700;font-size:0.95rem;margin-bottom:3px;">練習模式</div>
                        <div style="font-size:0.78rem;color:var(--text-sub);">每題作答後立即顯示對錯，隨機出全部題目</div>
                    </div>
                </div>
            </button>
            <!-- 測驗模式 -->
            <button onclick="closeAssessModal();openExamSettings();"
                style="background:var(--input-bg);border:1.5px solid var(--border-color);border-radius:14px;padding:18px 20px;text-align:left;cursor:pointer;transition:0.2s;color:var(--text-main);"
                onmouseover="this.style.borderColor='var(--accent)';this.style.background='var(--accent-dim)'"
                onmouseout="this.style.borderColor='var(--border-color)';this.style.background='var(--input-bg)'">
                <div style="display:flex;align-items:center;gap:12px;">
                    <div style="width:40px;height:40px;border-radius:10px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:1.1rem;flex-shrink:0;">
                        <i class="fa-solid fa-file-pen"></i>
                    </div>
                    <div>
                        <div style="font-weight:700;font-size:0.95rem;margin-bottom:3px;">測驗模式</div>
                        <div style="font-size:0.78rem;color:var(--text-sub);">自訂出題數量，全部作完後統一評分，可查看答題回顧</div>
                    </div>
                </div>
            </button>
        </div>
    </div>
</div>

<!-- 新增題庫 Modal -->
<div id="quiz-bank-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="width:380px;text-align:left;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <h3 class="modal-title" id="quiz-bank-modal-title" style="margin:0;">新增題庫</h3>
            <button class="btn-tool" onclick="closeBankModal()" style="width:30px;height:30px;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;">
            <input type="text" id="bank-name-input" placeholder="題庫名稱" style="background:var(--input-bg);border:1px solid var(--border-color);padding:12px;border-radius:8px;color:var(--text-main);outline:none;">
            <textarea id="bank-desc-input" placeholder="說明（可留空）" style="background:var(--input-bg);border:1px solid var(--border-color);padding:12px;border-radius:8px;color:var(--text-main);outline:none;resize:none;height:80px;font-family:'Segoe UI';"></textarea>
            <div id="bank-json-section" style="display:flex;flex-direction:column;gap:6px;background:var(--input-bg);border:1px solid var(--border-color);border-radius:8px;padding:10px;">
                <label for="bank-json-input" style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:0.85rem;color:var(--text-sub);">
                    <i class="fa-solid fa-file-arrow-up"></i>
                    <span id="bank-json-filename">上傳 JSON 題目檔（可選）</span>
                </label>
                <input type="file" id="bank-json-input" accept=".json,application/json" style="display:none;" onchange="onBankJsonSelected()">
                <div style="display:flex;gap:8px;align-items:center;">
                    <button class="btn-tool" style="flex:1;background:var(--input-bg);color:var(--text-main);width:auto;height:34px;font-size:0.8rem;" onclick="document.getElementById('bank-json-input').click()">選擇檔案</button>
                    <a href="/api/quiz/sample" class="btn-tool" style="flex:1;background:var(--input-bg);color:var(--text-main);width:auto;height:34px;font-size:0.8rem;text-decoration:none;display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-download" style="margin-right:4px;"></i>範例檔</a>
                </div>
                <div id="bank-json-status" style="font-size:0.75rem;color:var(--text-sub);min-height:1em;"></div>
            </div>
            <div style="display:flex;gap:10px;margin-top:6px;">
                <button class="btn-tool" style="flex:1;background:var(--input-bg);color:var(--text-main);" onclick="closeBankModal()">取消</button>
                <button class="btn-tool" style="flex:1;background:var(--accent);color:white;" id="bank-submit-btn" onclick="submitBank()">建立</button>
            </div>
        </div>
    </div>
</div>

<!-- 新增題目 / 匯入 合併 Modal -->
<div id="quiz-question-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="width:520px;max-height:88vh;overflow-y:auto;text-align:left;">
        <!-- 標題列 -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 class="modal-title" id="quiz-question-modal-title" style="margin:0;"><i class="fa-solid fa-plus"></i> 新增題目</h3>
            <button class="btn-tool" onclick="closeAddQuestionModal()" style="width:30px;height:30px;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <!-- Tab 切換 -->
        <div style="display:flex;gap:0;margin-bottom:20px;background:var(--input-bg);border-radius:10px;padding:4px;">
            <button id="add-tab-manual" onclick="switchAddTab('manual')"
                style="flex:1;border:none;border-radius:8px;padding:8px;font-size:0.85rem;cursor:pointer;font-weight:600;background:var(--accent);color:white;transition:0.15s;">
                <i class="fa-solid fa-pen"></i> 手動輸入
            </button>
            <button id="add-tab-import" onclick="switchAddTab('import')"
                style="flex:1;border:none;border-radius:8px;padding:8px;font-size:0.85rem;cursor:pointer;font-weight:600;background:transparent;color:var(--text-sub);transition:0.15s;">
                <i class="fa-solid fa-file-import"></i> 匯入 JSON
            </button>
        </div>

        <!-- ── 手動輸入 ── -->
        <div id="add-panel-manual" style="display:flex;flex-direction:column;gap:14px;">
            <select id="q-type-select" class="custom-select">
                <option value="single">單選題</option>
                <option value="multiple">複選題</option>
            </select>
            <textarea id="q-content-input" placeholder="題目內容..." style="background:var(--input-bg);border:1px solid var(--border-color);padding:12px;border-radius:8px;color:var(--text-main);outline:none;resize:none;height:90px;font-family:'Segoe UI';"></textarea>
            <div>
                <div style="font-size:0.8rem;color:var(--text-sub);margin-bottom:8px;">選項（點圓圈標記正確答案）</div>
                <div id="q-options-list" style="display:flex;flex-direction:column;gap:8px;"></div>
                <button class="btn-tool" style="margin-top:10px;width:100%;background:var(--input-bg);color:var(--text-main);" onclick="addOptionRow()">
                    <i class="fa-solid fa-plus"></i> 新增選項
                </button>
            </div>
            <div>
                <div style="font-size:0.8rem;color:var(--text-sub);margin-bottom:8px;">分類標籤（可留空）</div>
                <div class="tag-input-wrap">
                    <i class="fa-solid fa-tag"></i>
                    <input type="text" id="q-tag-input" list="q-tag-suggestions" placeholder="例如：單選題、Ch1...">
                    <datalist id="q-tag-suggestions"></datalist>
                </div>
            </div>
            <div style="display:flex;gap:10px;margin-top:4px;">
                <button class="btn-tool" style="flex:1;background:var(--input-bg);color:var(--text-main);" onclick="closeAddQuestionModal()">取消</button>
                <button class="btn-tool" style="flex:1;background:var(--accent);color:white;" id="q-submit-btn" onclick="submitQuestion()">儲存</button>
            </div>
        </div>

        <!-- ── 匯入 JSON ── -->
        <div id="add-panel-import" style="display:none;flex-direction:column;gap:14px;">
            <div style="background:var(--input-bg);border-radius:10px;padding:12px 14px;font-size:0.82rem;color:var(--text-sub);line-height:1.7;">
                <div style="margin-bottom:6px;color:var(--text-main);font-weight:600;">支援的 JSON 格式</div>
                <div>• <b>單選題</b>：<code>options</code> 為物件 <code>{A:…, B:…}</code>，<code>answer</code> 為字母</div>
                <div>• <b>複選題</b>：<code>options</code> 為陣列，<code>answers</code> 為正確選項陣列</div>
                <div style="margin-top:6px;">設定 <code>"isEnabled": false</code> 的題目將被跳過</div>
            </div>
            <a href="/api/quiz/sample" download="quiz_sample.json"
               style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;border:1px dashed var(--border-color);color:var(--text-sub);font-size:0.85rem;text-decoration:none;transition:0.2s;"
               onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
               onmouseout="this.style.borderColor='var(--border-color)';this.style.color='var(--text-sub)'">
                <i class="fa-solid fa-download"></i> 下載範例 JSON（含單選題與複選題）
            </a>
            <div>
                <label style="display:block;font-size:0.8rem;color:var(--text-sub);margin-bottom:6px;">選擇 JSON 檔案</label>
                <input type="file" id="import-file-input" accept=".json,application/json"
                       style="width:100%;color:var(--text-main);font-size:0.85rem;">
            </div>
            <div id="import-status" style="font-size:0.82rem;min-height:18px;"></div>
            <div style="display:flex;gap:10px;margin-top:4px;">
                <button class="btn-tool" style="flex:1;background:var(--input-bg);color:var(--text-main);" onclick="closeAddQuestionModal()">取消</button>
                <button class="btn-tool" style="flex:1;background:var(--accent);color:white;" onclick="submitImport()">
                    <i class="fa-solid fa-upload"></i> 開始匯入
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 練習模式 Overlay -->
<div id="quiz-practice-overlay" class="quiz-practice-overlay" style="display:none;">
    <div class="quiz-practice-box" style="position:relative;">
        <button class="btn-tool" style="position:absolute;top:14px;right:14px;width:30px;height:30px;" onclick="exitPractice()"><i class="fa-solid fa-xmark"></i></button>
        <!-- 進度 -->
        <div id="prac-progress-text" class="quiz-practice-progress"></div>
        <div class="quiz-practice-progress-bar"><div id="prac-progress-fill" class="quiz-practice-progress-fill" style="width:0%"></div></div>
        <!-- 題目 -->
        <div id="prac-question" class="quiz-practice-q"></div>
        <div id="prac-hint" class="quiz-practice-hint"></div>
        <div id="prac-options" class="quiz-practice-options"></div>
        <!-- 動作列 -->
        <div class="quiz-practice-actions">
            <span id="prac-feedback" class="quiz-practice-feedback"></span>
            <button id="prac-next-btn" class="btn-tool" style="background:var(--accent);color:white;padding:0 20px;display:none;width:auto;height:40px;white-space:nowrap;flex-shrink:0;" onclick="nextPracticeQuestion()">下一題 <i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <!-- 結果頁（隱藏） -->
        <div id="prac-result" class="quiz-result-box" style="display:none;">
            <div class="quiz-result-score" id="prac-score-text"></div>
            <div class="quiz-result-label">答題正確率</div>
            <div class="quiz-result-detail" id="prac-score-detail"></div>
            <div style="display:flex;gap:10px;margin-top:28px;justify-content:center;flex-wrap:wrap;">
                <button class="btn-tool" style="background:var(--accent);color:white;padding:0 20px;" onclick="startPractice()"><i class="fa-solid fa-rotate-right"></i> 再練一次</button>
                <button id="prac-review-wrong-btn" class="btn-tool btn-warn" style="display:none;padding:0 20px;" onclick="reviewWrongPractice()"><i class="fa-solid fa-rotate-left"></i> 複習錯題</button>
                <button class="btn-tool" style="background:var(--input-bg);color:var(--text-main);padding:0 20px;" onclick="exitPractice()">離開</button>
            </div>
        </div>
    </div>
</div>

<!-- 測驗設定 Modal -->
<div id="quiz-exam-settings-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="width:360px;text-align:left;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <h3 class="modal-title" style="margin:0;"><i class="fa-solid fa-file-pen"></i> 開始測驗</h3>
            <button class="btn-tool" onclick="closeExamSettings()" style="width:30px;height:30px;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px;">
            <div id="exam-tag-filter-wrap" style="display:none;">
                <label style="display:block;font-size:0.8rem;color:var(--text-sub);margin-bottom:6px;">考題分類（可多選）</label>
                <div id="exam-tag-filter" style="display:flex;flex-wrap:wrap;gap:6px;max-height:140px;overflow-y:auto;"></div>
            </div>
            <div>
                <label style="display:block;font-size:0.8rem;color:var(--text-sub);margin-bottom:6px;">出題數量</label>
                <div style="display:flex;align-items:center;gap:10px;">
                    <input type="range" id="exam-count-slider" min="1" max="50" value="10"
                           style="flex:1;accent-color:var(--accent);"
                           oninput="syncExamCount('slider',this.value)">
                    <div style="display:flex;align-items:center;border:1.5px solid var(--accent);border-radius:8px;overflow:hidden;background:var(--input-bg);">
                        <input type="number" id="exam-count-display" min="1" max="50" value="10"
                               style="width:48px;background:transparent;border:none;padding:4px 6px;color:var(--accent);font-size:1.1rem;font-weight:700;text-align:center;outline:none;-moz-appearance:textfield;"
                               oninput="syncExamCount('input',this.value)">
                        <div style="display:flex;flex-direction:column;border-left:1px solid var(--border-color);">
                            <button onclick="syncExamCount('input', parseInt(document.getElementById('exam-count-display').value||0)+1)"
                                    style="background:none;border:none;cursor:pointer;padding:3px 7px;color:var(--text-sub);line-height:1;font-size:0.55rem;transition:0.15s;"
                                    onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-sub)'">▲</button>
                            <button onclick="syncExamCount('input', parseInt(document.getElementById('exam-count-display').value||0)-1)"
                                    style="background:none;border:none;cursor:pointer;padding:3px 7px;color:var(--text-sub);line-height:1;font-size:0.55rem;border-top:1px solid var(--border-color);transition:0.15s;"
                                    onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-sub)'">▼</button>
                        </div>
                    </div> 題
                </div>
                <div id="exam-count-hint" style="font-size:0.75rem;color:var(--text-sub);margin-top:4px;"></div>
            </div>
            <div style="display:flex;gap:10px;margin-top:4px;">
                <button class="btn-tool" style="flex:1;background:var(--input-bg);color:var(--text-main);" onclick="closeExamSettings()">取消</button>
                <button class="btn-tool" style="flex:1;background:var(--accent);color:white;" onclick="startExam()">
                    <i class="fa-solid fa-play"></i> 開始
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 練習設定 Modal -->
<div id="quiz-practice-settings-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="width:360px;text-align:left;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <h3 class="modal-title" style="margin:0;"><i class="fa-solid fa-dumbbell"></i> 開始練習</h3>
            <button class="btn-tool" onclick="closePracticeSettings()" style="width:30px;height:30px;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px;">
            <div id="prac-tag-filter-wrap" style="display:none;">
                <label style="display:block;font-size:0.8rem;color:var(--text-sub);margin-bottom:6px;">練習分類（可多選，不選=全部）</label>
                <div id="prac-tag-filter" style="display:flex;flex-wrap:wrap;gap:6px;max-height:140px;overflow-y:auto;"></div>
            </div>
            <div id="prac-tag-hint" style="font-size:0.75rem;color:var(--text-sub);"></div>
            <div style="display:flex;gap:10px;margin-top:4px;">
                <button class="btn-tool" style="flex:1;background:var(--input-bg);color:var(--text-main);" onclick="closePracticeSettings()">取消</button>
                <button class="btn-tool" style="flex:1;background:var(--accent);color:white;" onclick="confirmStartPractice()">
                    <i class="fa-solid fa-play"></i> 開始
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 測驗模式 Overlay -->
<div id="quiz-exam-overlay" class="quiz-exam-overlay" style="display:none;">
    <div class="quiz-exam-box" id="exam-main-box" style="position:relative;">
        <button class="btn-tool" style="position:absolute;top:14px;right:14px;width:30px;height:30px;" onclick="confirmExitExam()"><i class="fa-solid fa-xmark"></i></button>
        <!-- 進度 -->
        <div id="exam-progress-text" class="quiz-practice-progress"></div>
        <div class="quiz-practice-progress-bar"><div id="exam-progress-fill" class="quiz-practice-progress-fill" style="width:0%"></div></div>
        <!-- 導覽點 -->
        <div id="exam-nav-dots" class="exam-nav-dots"></div>
        <!-- 題目 -->
        <div id="exam-question" class="quiz-practice-q"></div>
        <div id="exam-hint" class="quiz-practice-hint"></div>
        <div id="exam-options" class="quiz-practice-options"></div>
        <!-- 動作 -->
        <div class="exam-actions">
            <button class="btn-tool" id="exam-prev-btn" onclick="examGoto(examIndex-1)" style="background:var(--input-bg);color:var(--text-main);">
                <i class="fa-solid fa-arrow-left"></i> 上一題
            </button>
            <button class="btn-tool" id="exam-submit-btn" onclick="confirmSubmitExam()" style="background:#4caf50;color:white;display:none;">
                <i class="fa-solid fa-flag-checkered"></i> 交卷
            </button>
            <button class="btn-tool" id="exam-next-btn" onclick="examGoto(examIndex+1)" style="background:var(--accent);color:white;">
                下一題 <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
        <!-- 結果頁 -->
        <div id="exam-result" style="display:none;">
            <div class="exam-result-header">
                <div id="exam-result-score" class="exam-result-score"></div>
                <div id="exam-result-meta" class="exam-result-meta"></div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
                <div class="history-filter-tabs">
                    <button class="history-tab-btn active" onclick="filterExamReview('all',this)">全部</button>
                    <button class="history-tab-btn" onclick="filterExamReview('wrong',this)">答錯</button>
                    <button class="history-tab-btn" onclick="filterExamReview('correct',this)">答對</button>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn-tool" style="background:var(--accent);color:white;width:auto;height:36px;padding:0 16px;white-space:nowrap;" onclick="openExamSettings()">
                        <i class="fa-solid fa-rotate-right"></i> 再測一次
                    </button>
                    <button id="exam-retake-wrong-btn" class="btn-tool btn-warn" style="display:none;width:auto;height:36px;padding:0 16px;white-space:nowrap;" onclick="retakeWrongExam()">
                        <i class="fa-solid fa-rotate-left"></i> 只重測錯題
                    </button>
                    <button class="btn-tool" style="background:var(--input-bg);color:var(--text-main);width:auto;height:36px;padding:0 16px;white-space:nowrap;" onclick="exitExam()">離開</button>
                </div>
            </div>
            <div id="exam-review-list" class="exam-review-list"></div>
        </div>
    </div>
</div>
