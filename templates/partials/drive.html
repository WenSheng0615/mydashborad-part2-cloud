<div id="view-drive" class="app-view">
    <div class="app-header">
        <h1 class="app-title"><i class="fa-brands fa-google-drive"></i> Cloud Drive</h1>
        <div class="user-placeholder"></div>
    </div>

    <div class="drive-layout">
        <div class="drive-main">
            <div class="drive-toolbar">
                <div class="toolbar-left">
                    <button class="btn-tool" id="btn-back" onclick="goUpFolder()" disabled title="上一層"><i
                            class="fa-solid fa-arrow-left"></i></button>
                    <div style="width:1px; height:24px; background:#444; margin:0 5px;"></div>
                    <select class="custom-select" id="filter-type" onchange="applyFilters()">
                        <option value="">所有類型</option>
                        <option value="folder">資料夾</option>
                        <option value="image">圖片</option>
                        <option value="pdf">PDF</option>
                    </select>
                </div>
                <div class="search-wrapper" style="margin:0 20px;">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="drive-search" placeholder="搜尋檔案..."
                        onkeyup="if(event.key==='Enter') applyFilters()">
                </div>
                <div class="toolbar-right" style="display:flex; gap:10px;">
                    <button class="btn-tool" id="btn-move-file" onclick="prepareMoveFile()" title="移動檔案">
                        <i class="fa-solid fa-file-export"></i>
                    </button>
                    <div style="width:1px; height:24px; background:#444; margin:0 5px;"></div>
                    <button class="btn-tool active" id="btn-grid" onclick="switchLayout('grid')"><i
                            class="fa-solid fa-border-all"></i></button>
                    <button class="btn-tool" id="btn-list" onclick="switchLayout('list')"><i
                            class="fa-solid fa-list"></i></button>
                    <div style="width:1px; height:24px; background:#444; margin:0 5px;"></div>
                    <input type="file" id="file-upload" style="display:none" onchange="uploadFile()">
                    <button class="btn-tool" onclick="document.getElementById('file-upload').click()"><i
                            class="fa-solid fa-cloud-arrow-up"></i></button>
                    <button class="btn-tool" onclick="applyFilters()"><i class="fa-solid fa-rotate"></i></button>
                </div>
            </div>

            <div style="margin-bottom:10px; color:#888; display:flex; padding:0 5px;">
                <span id="current-path"><i class="fa-solid fa-folder-tree"></i> Root</span>
                <span id="data-source" style="margin-left:auto; opacity:0.7;">...</span>
            </div>

            <div class="file-container-wrapper" onclick="handleContainerClick(event)">
                <div id="file-container" class="grid-files"></div>
            </div>
        </div>

        <div class="drive-sidebar">
                <div id="preview-area">
                    <div class="preview-placeholder">
                        <i class="fa-regular fa-file" style="font-size:4rem; opacity:0.3; margin-bottom:15px;"></i>
                        <p>點選檔案預覽</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 自定義移動檔案彈窗 -->
        <div id="move-modal" class="modal-overlay" style="display:none;">
            <div class="modal-box" style="width: 400px; text-align: left;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h3 class="modal-title" style="margin:0;"><i class="fa-solid fa-file-export" style="margin-right:10px; color:var(--accent);"></i>移動檔案</h3>
                    <button class="btn-tool" onclick="closeMoveModal()" style="width:30px; height:30px;"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div style="display:flex; flex-direction:column; gap:15px;">
                    <div style="background:var(--input-bg); padding:12px; border-radius:8px; border:1px solid var(--border-color);">
                        <div style="font-size:0.8rem; color:var(--text-sub); margin-bottom:5px;">正在移動</div>
                        <div id="move-file-name" style="font-weight:bold; color:var(--text-main); word-break:break-all;">檔名</div>
                    </div>

                    <div>
                        <label style="display:block; margin-bottom:8px; font-size:0.9rem; color:var(--text-main);">目標資料夾 ID</label>
                        <input type="text" id="move-target-id" placeholder="貼上目標資料夾的 ID..."
                            style="width:100%; background:var(--input-bg); border:1px solid var(--border-color); padding:12px; border-radius:8px; color:var(--text-main); outline:none; box-sizing:border-box;">
                        <div style="font-size:0.75rem; color:var(--text-sub); margin-top:8px; line-height:1.4;">
                            <i class="fa-solid fa-circle-info" style="margin-right:5px;"></i> 提示：您可以先進入目標資料夾，點擊上方路徑欄來複製 ID。
                        </div>
                    </div>

                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn-modal btn-cancel" style="flex:1;" onclick="closeMoveModal()">取消</button>
                        <button class="btn-modal btn-confirm" style="flex:1;" onclick="submitMove()">確認搬移</button>
                    </div>
                </div>
            </div>
        </div>
        </div>
