<div id="view-modules" class="app-view">
    <header class="app-header"><h1 class="app-title">我的模組</h1><button type="button" class="home-manage" onclick="openApp('settings')">一般設定</button></header>
    <div class="module-center">
        <section class="module-intro"><p class="module-kicker">FOCUSFLOW / APPS</p><h2>打造自己的工作空間。</h2><p>選擇需要的 App，讓 HomeCloud 保持剛剛好的樣子。</p></section>
        <div class="module-toolbar"><label class="module-search"><span class="sr-only">搜尋模組</span><input type="search" id="module-search" placeholder="搜尋名稱、功能或服務…" autocomplete="off"></label><button type="button" id="module-reload" class="module-button">重新載入</button></div>
        <div class="module-filters" role="group" aria-label="模組狀態篩選"><button data-module-filter="all" aria-pressed="true">全部 App</button><button data-module-filter="enabled" aria-pressed="false">已啟用</button><button data-module-filter="disabled" aria-pressed="false">已停用</button></div>
        <p id="module-status" class="module-status" role="status" aria-live="polite">正在載入模組設定…</p>
        <section aria-labelledby="module-heading"><div class="module-section-heading"><h2 id="module-heading">內建 App</h2><span id="module-count"></span></div><div id="module-list" class="module-list"></div><p id="module-empty" class="module-empty" hidden>沒有符合條件的 App。試試其他關鍵字或篩選條件。</p></section>
        <section id="module-core-section" aria-labelledby="module-core-heading"><div class="module-section-heading"><h2 id="module-core-heading">平台核心</h2><span>固定啟用</span></div><div id="module-core-list" class="module-list"></div></section>
        <p class="module-footnote">停用會保留資料，重新啟用即可繼續使用。內建 App 隨 FocusFlow 更新。</p>
    </div>
</div>
<dialog id="module-detail" class="module-detail" aria-labelledby="module-detail-title"><div class="module-detail-heading"><h2 id="module-detail-title"></h2><button type="button" id="module-detail-close" aria-label="關閉模組詳細資料">×</button></div><div id="module-detail-body"></div></dialog>
